<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TV Bar — Comandas</title>
  <meta name="robots" content="noindex, nofollow" />
  <!--
    TV do bar — versão CUSTO ZERO.
    Filmes, clipes e rádios foram removidos. Fica só o painel de comandas

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: 0; display: block; background: #000; }
  </style>
</head>
<body>
  <iframe id="comandasFrame" src="https://mestres.bargestao.com.br/admin/tv" allow="autoplay"></iframe>
