<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel TV — Art na Régua</title>
  <meta name="robots" content="noindex, nofollow" />
  <!--
    Painel TV — versão CUSTO ZERO.
    Sem canais de TV, sem clipes, sem rádio, sem vídeo: só relógio + agenda.
    Consulta a agenda a cada 3 min, apenas das 07h às 22h e só com a tela visível,
    para não manter servidor/banco acordados à toa.
  -->
  <style>
    :root {
      --preto: #0b0b0d; --preto-2: #121216; --preto-3: #1a1a20;
      --dourado: #c9a15c; --dourado-claro: #e6c98a;
      --texto: #ece7dd; --muted: #a39a8a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: radial-gradient(ellipse at top, var(--preto-2), var(--preto) 70%);
      color: var(--texto); height: 100vh; overflow: hidden;
      display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
    }
    .topo {
      display: flex; align-items: center; justify-content: space-between;
      padding: 2.2vh 4vw; border-bottom: 1px solid rgba(201,161,92,.3);
    }
    .marca {
      display: flex; align-items: center; gap: 1rem;
      font-family: Georgia, "Times New Roman", serif; font-weight: 800;
      font-size: 4.2vh; color: var(--dourado-claro);
    }
    .marca img { height: 7vh; width: auto; }
    .relogio { text-align: right; }
    .relogio .hora {
      font-family: Georgia, "Times New Roman", serif; font-weight: 800;
      font-size: 8vh; line-height: 1; color: var(--dourado-claro);
      font-variant-numeric: tabular-nums;
    }
    .relogio .data { color: var(--muted); font-size: 2.4vh; margin-top: .6vh; }

    .agenda {
      flex: 1; display: grid; grid-template-columns: 1.25fr 1fr; gap: 3vw;
      padding: 5vh 4vw;
    }
    .card {
      border-radius: 2.4vh; padding: 5vh 3vw;
      display: flex; flex-direction: column; justify-content: center; gap: 1.6vh;
    }
    .card.agora {
      background: linear-gradient(135deg, rgba(201,161,92,.2), rgba(201,161,92,.05));
      border: 2px solid var(--dourado);
    }
    .card.proximo { background: var(--preto-3); border: 1px solid rgba(255,255,255,.08); }
    .rotulo {
      font-size: 2.6vh; letter-spacing: .25em; text-transform: uppercase;
      font-weight: 800; color: var(--dourado);
    }
    .nome {
      font-family: Georgia, "Times New Roman", serif; font-weight: 800;
      font-size: 9vh; line-height: 1.05; word-break: break-word;
    }
    .card.proximo .nome { font-size: 7vh; }
    .detalhe { font-size: 3.4vh; color: var(--muted); }
    .rodape {
      text-align: center; padding: 1.6vh; font-size: 1.8vh; color: var(--muted);
      border-top: 1px solid rgba(255,255,255,.05);
    }
    @media (orientation: portrait) {
      .agenda { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="topo">
    <div class="marca"><img src="/images/logo-icon.png" alt="" /> Art na Régua</div>
    <div class="relogio">
      <div class="hora" id="relHora">--:--</div>
      <div class="data" id="relData">—</div>
    </div>
  </div>

  <div class="agenda">
    <div class="card agora">
      <span class="rotulo">Em atendimento agora</span>
      <span class="nome" id="agoraNome">—</span>
      <span class="detalhe" id="agoraDetalhe"></span>
    </div>
    <div class="card proximo">
      <span class="rotulo">Próximo</span>
      <span class="nome" id="proximoNome">—</span>
      <span class="detalhe" id="proximoDetalhe"></span>
    </div>
  </div>

  <div class="rodape" id="rodape">Agende pelo site</div>

  <script>
    (function () {
      'use strict';
      var INTERVALO_MS = 3 * 60 * 1000;   // agenda a cada 3 minutos
      var HORA_INICIO = 7, HORA_FIM = 22;  // fora disso, não consulta o servidor

      var dias = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
      var meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
      function dois(n) { return String(n).padStart(2, '0'); }
      function relogio() {
        var d = new Date();
        document.getElementById('relHora').textContent = dois(d.getHours()) + ':' + dois(d.getMinutes());
        document.getElementById('relData').textContent =
          dias[d.getDay()] + ', ' + d.getDate() + ' de ' + meses[d.getMonth()];
      }
      relogio();
      setInterval(relogio, 15000);

      function detalhe(a) {
        if (!a) return '';
        var extra = Number(a.num_slots) >= 2 ? ' · 2 horários' : '';
        return (a.horario || '') + ' — ' + (a.servico || '') + extra;
      }
      function preencher(id, a, vazio) {
        document.getElementById(id + 'Nome').textContent = a ? a.nome : vazio;
        document.getElementById(id + 'Detalhe').textContent = detalhe(a);
      }
      function horarioDeFuncionamento() {
        var h = new Date().getHours();
        return h >= HORA_INICIO && h < HORA_FIM;
      }
      async function atualizarAgenda() {
        if (document.hidden) return;
        if (!horarioDeFuncionamento()) {
          preencher('agora', null, 'Fechado');
          preencher('proximo', null, '—');
          return;
        }
        try {
          var r = await fetch('/api/tv/agora', { cache: 'no-store' });
          var j = await r.json();
          preencher('agora', j.atual, 'Livre');
          preencher('proximo', j.proximo, '—');
        } catch (e) { /* sem rede: mantém o último estado */ }
      }
      atualizarAgenda();
      setInterval(atualizarAgenda, INTERVALO_MS);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) atualizarAgenda();
      });
    })();
  </script>
</body>
</html>
